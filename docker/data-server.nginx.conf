# Read-only static file server for MCAP bags: HTTP Range (browser streaming) + CORS.
server {
    listen 8081;
    server_name _;
    sendfile on;
    tcp_nopush on;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "Range, If-Range, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
    add_header Accept-Ranges bytes always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /raw/ {
        alias /data/raw/;
        autoindex off;
        if ($request_method = OPTIONS) { return 204; }
    }
    # time-fixed copies written by radar-kpi (cache volume, mounted read-only here)
    location /fixed/ {
        alias /cache/fixed/;
        autoindex off;
        if ($request_method = OPTIONS) { return 204; }
    }
    location /processed/ {
        alias /data/processed/;
        autoindex off;
        if ($request_method = OPTIONS) { return 204; }
    }
}
